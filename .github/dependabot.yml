# Specify reviewers for pull requests

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "monthly"
      day: "sunday"
      time: "09:00"
    ignore:
      # PyMieSim targets PyOptik 3's catalog API. Future major versions require
      # an explicit compatibility review before Dependabot can update them.
      - dependency-name: "PyOptik"
        update-types:
          - "version-update:semver-major"
