# Specify reviewers for pull requests

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "monthly"
      day: "sunday"
      time: "09:00"
    ignore:
      # PyMieSim still uses the legacy PyOptik.Material registry. PyOptik 3
      # replaced it with the catalog API and requires a deliberate migration.
      - dependency-name: "PyOptik"
        update-types:
          - "version-update:semver-major"
