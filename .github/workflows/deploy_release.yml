name: Publish release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  release:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_release.yml@v4
    with:
      pypi_python_version: "3.11"
      pypi_build_linux: true
      pypi_build_macos: true
      pypi_build_windows: true
      pypi_apt_package: xvfb jq
      pypi_mingw_package: |
        mingw-w64-x86_64-toolchain
        mingw-w64-x86_64-ninja
        mingw-w64-x86_64-gcc-fortran
        mingw-w64-x86_64-pkg-config
      conda_python_versions: '["3.11", "3.12", "3.13"]'
      conda_os_list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      conda_package_name: pymiesim
      conda_recipe_path: conda.recipe
      conda_test_import: PyMieSim
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}