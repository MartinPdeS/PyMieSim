name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    uses: MartinPdeS/MPSActions/.github/workflows/run_tests.yml@v11
    with:
      install-command: >-
        python -m pip install --upgrade pip && python -m pip install -e ".[testing,dev]"
      test-command: |
        python -m PyOptik setup --no-progress
        python -m mypy
        python -m mypy.stubtest PyMieSim.single.setup PyMieSim.labeled_array --mypy-config-file pyproject.toml --allowlist tools/stubtest_allowlist.txt
        python -m pytest -q
