name: Wheel smoke test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    uses: MartinPdeS/MPSActions/.github/workflows/build_wheels.yml@a01969bc5af90666281f9d37acffdf6a4629763a
    with:
      build_windows: true
      mingw_package: |
        mingw-w64-x86_64-toolchain
        mingw-w64-x86_64-ninja
        mingw-w64-x86_64-gcc-fortran
        mingw-w64-x86_64-pkg-config
  wheel:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python and build tools
        uses: MartinPdeS/MPSActions/actions/setup-python@a01969bc5af90666281f9d37acffdf6a4629763a
        with:
          python-version: ${{ matrix.python-version }}
          install-command: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python tools/check_wheel.py dist/*.whl
