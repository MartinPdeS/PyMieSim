name: Wheel smoke test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python and build tools
        uses: MartinPdeS/MPSActions/actions/setup-python@0f5927acf88b25b5d253421e508387897096a2cc
        with:
          python-version: ${{ matrix.python-version }}
          install-command: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python tools/check_wheel.py dist/*.whl
