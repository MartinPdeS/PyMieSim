<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Incident and scattered directions in the x-z plane</title>
<desc id="desc">Incident light propagates along positive z through a sphere at the origin. A scattered ray makes angle alpha with positive z. Positive x points upward and positive y points out of the page.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker></defs>
<rect width="760" height="300" fill="#fff"/>
<g fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)">
<path d="M60 210 H680"/>
<path d="M280 260 V35"/>
<path d="M280 210 L555 62"/>
</g>
<circle cx="280" cy="210" r="22" fill="#d7e9fa" stroke="#2471a3" stroke-width="2"/>
<path d="M365 210 A85 85 0 0 0 354 169" fill="none" stroke="#b03a2e" stroke-width="2"/>
<g font-family="sans-serif" font-size="18" fill="#17202a">
<text x="70" y="195">Incident light</text><text x="687" y="216">+z</text>
<text x="292" y="45">+x</text><text x="410" y="75">Scattered direction</text>
<text x="380" y="185" fill="#b03a2e">α</text>
<text x="304" y="247">Particle at origin</text>
<text x="460" y="270">+y: out of the page</text>
</g>
</svg>
